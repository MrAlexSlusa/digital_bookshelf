# Pings the Render API on a schedule.
#
# This is primarily an uptime monitor: a failed run means /api/health stopped
# answering, and GitHub emails about it. It is NOT a reliable keep-warm --
# GitHub treats cron as best effort and drops most ticks on a high-frequency
# schedule, so in practice this fires every few hours, well outside Render's
# ~15 minute idle window. See the README for options that actually keep the
# instance warm.
name: Ping API health

on:
  schedule:
    # Requests every 15 minutes. GitHub honours only a fraction of the ticks
    # on a schedule this frequent -- observed cadence is every 2-4 hours --
    # so treat this as an upper bound, not an interval.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A slow cold start should never pile up behind the next scheduled run.
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          # Same repository variable the Pages deploy uses, e.g.
          # https://digital-bookshelf-api.onrender.com/api
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Repository variable API_URL is not set." \
                 "Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          # Tolerate a trailing slash on the variable.
          health="${API_URL%/}/health"
          echo "Pinging $health"

          # A cold instance can take the better part of a minute to boot, so
          # allow a generous timeout and a few retries before calling it down.
          for attempt in 1 2 3 4 5; do
            code=$(curl --silent --show-error --location \
                        --max-time 90 \
                        --output response.txt \
                        --write-out '%{http_code}' \
                        "$health") && status=0 || status=$?

            if [ "$status" -eq 0 ] && [ "$code" = "200" ]; then
              echo "Attempt $attempt: HTTP 200"
              cat response.txt
              exit 0
            fi

            echo "Attempt $attempt failed (curl exit $status, HTTP ${code:-none})"
            if [ -s response.txt ]; then head -c 500 response.txt; echo; fi
            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done

          echo "::error::API did not return HTTP 200 after 5 attempts."
          exit 1
