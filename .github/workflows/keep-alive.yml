# Keeps the Render API awake around the clock.
#
# Render's free web services spin down after ~15 minutes with no traffic, so
# the first visitor after an idle spell waits out a cold start. This pings the
# health endpoint every 10 minutes, which keeps the instance warm 24/7 and
# emails you (via a failed run) if the API ever stops answering.
name: Keep API awake

on:
  schedule:
    # Every 10 minutes. GitHub queues cron runs on a best-effort basis, so
    # treat the interval as "roughly every 10 minutes", not a hard guarantee.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A slow cold start should never pile up behind the next scheduled run.
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          # Same repository variable the Pages deploy uses, e.g.
          # https://digital-bookshelf-api.onrender.com/api
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Repository variable API_URL is not set." \
                 "Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi

          # Tolerate a trailing slash on the variable.
          health="${API_URL%/}/health"
          echo "Pinging $health"

          # A cold instance can take the better part of a minute to boot, so
          # allow a generous timeout and a few retries before calling it down.
          for attempt in 1 2 3 4 5; do
            code=$(curl --silent --show-error --location \
                        --max-time 90 \
                        --output response.txt \
                        --write-out '%{http_code}' \
                        "$health") && status=0 || status=$?

            if [ "$status" -eq 0 ] && [ "$code" = "200" ]; then
              echo "Attempt $attempt: HTTP 200"
              cat response.txt
              exit 0
            fi

            echo "Attempt $attempt failed (curl exit $status, HTTP ${code:-none})"
            if [ -s response.txt ]; then head -c 500 response.txt; echo; fi
            if [ "$attempt" -lt 5 ]; then sleep 30; fi
          done

          echo "::error::API did not return HTTP 200 after 5 attempts."
          exit 1
