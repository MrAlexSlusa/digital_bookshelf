name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: client
      - run: npm run build
        working-directory: client

  server-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: server
      - name: Syntax-check server source
        working-directory: server
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
