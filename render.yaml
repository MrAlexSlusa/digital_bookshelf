services:
  - type: web
    name: digital-bookshelf-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
